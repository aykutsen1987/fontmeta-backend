services:
  - type: web
    name: fontmeta-backend
    env: node
    buildCommand: npm install && node scripts/download-fonts.js
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FONT_DIR
        value: /opt/render/project/src/fonts
      - key: FONT_MATCH_THRESHOLD
        value: "0.80"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RATE_LIMIT_MAX
        value: "60"
